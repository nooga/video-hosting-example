server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routes (e.g. /video/:id) — serve index.html on refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config is generated at container start
    location = /runtime-config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are immutable
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
