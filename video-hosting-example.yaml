namespace: video-hosting-example

auth0:
  defines: auth0/application
  domain: <- secret("default-auth0-management-api-url")
  app-name: "Auth0 Integration App"
  description: "Auth0 Integration App"
  app-type: "spa"
  callback-url: <- $app-domain "/callback" concat-all
  allowed-logout-urls:
    - <- $app-domain concat-all
  web-origins:
    - <- $app-domain
  allowed-origins:
    - <- $app-domain
  management-client-id-secret: default-auth0-management-client-id
  management-client-token-secret: default-auth0-management-client-secret
  management-api: <- "https://" secret("default-auth0-management-api-url") concat-all
  permitted-secrets:
    default-auth0-management-client-id: true
    default-auth0-management-client-secret: true
    default-auth0-management-api-url: true
  variables:
    app-domain:
      type: string
      description: Domain of the application using Auth0.
      value: <- connection-target("frontend-site") entity-state get-member("url")
  services:
    data:
      protocol: custom
  connections:
    app:
      runnable: video-hosting-example/frontend-site
      service: data
  depends:
    wait-for:
      runnables:
        - video-hosting-example/frontend-site
      timeout: 60

frontend-site:
  defines: netlify/site
  name: monk-video-hosting-example-ftyb1
  force_ssl: false
  secret_ref: default-netlify-pat
  permitted-secrets:
    default-netlify-pat: true
  services:
    data:
      protocol: custom

redis:
  defines: digitalocean-database/database
  name: my-redis-cache
  engine: valkey
  num_nodes: 1
  region: fra1
  size: db-s-1vcpu-2gb
  tags:
    - environment:production
    - application:cache
  db_config:
    redis_maxmemory_policy: "allkeys-lru"
  services:
    redis-svc:
      protocol: custom
  checks:
    readiness:
      period: 30
      initialDelay: 2
      attempts: 30

spaces-keys:
  defines: digitalocean-spaces/spaces-keys
  permitted-secrets:
    do-spaces-access-key: true
    do-spaces-secret-key: true
  services:
    data:
      protocol: custom

spaces:
  defines: digitalocean-spaces/spaces-bucket
  bucket_name: monk-youtube-example-spaces
  region: nyc3
  versioning: false
  public_read_access: true
  public_write_access: false
  services:
    bucket:
      protocol: custom
  depends:
    wait-for:
      runnables:
        - video-hosting-example/spaces-keys
  permitted-secrets:
    do-spaces-access-key: true
    do-spaces-secret-key: true

mongodb-database:
  defines: digitalocean-database/database
  name: video-hosting-example
  engine: mongodb
  version: "7.0"
  num_nodes: 1
  region: lon1
  size: db-s-4vcpu-8gb
  tags:
    - environment:production
    - application:document-store
  services:
    data:
      protocol: custom
  checks:
    readiness:
      period: 30
      initialDelay: 2
      attempts: 30

backend:
  defines: runnable
  permitted-secrets:
    default-redis-cloud-db-password: true
    mongodb-password: true
    default-auth0-management-api-url: true
  metadata:
    name: backend
    description: "Go-based backend API for a YouTube-like video platform. Handles user, video, and job management, connects to MongoDB, Redis, and MinIO for data, queue, and storage. Exposes HTTP API for frontend and worker interaction."
  containers:
    main:
      image: "backend"
      image-tag: "latest"
      # entrypoint: sleep 36000
  services:
    http:
      description: HTTP API service for frontend and worker communication.
      protocol: tcp
      port: 8080
      publish: true
      host-port: 8080
      container: main
  connections:
    mongodb:
      target: video-hosting-example/mongodb-database
      service: data
    redis:
      target: video-hosting-example/redis
      service: redis-svc
    minio:
      target: video-hosting-example/minio
      service: api
    frontend:
      target: video-hosting-example/frontend-site
      service: data
  depends:
    wait-for:
      runnables:
        - video-hosting-example/mongodb-database
        - video-hosting-example/redis
        - video-hosting-example/minio
      timeout: 300
  variables:
    port:
      type: int
      env: PORT
      description: Port for the backend HTTP server to listen on.
      value: 8080
    mongodb-connection-string:
      env: MONGODB_CONNECTION_STRING
      value: <- connection-target("mongodb") entity-state get-member("connection/uri")
      type: string
    mongodb-uri:
      type: string
      env: MONGODB_URI
      description: MongoDB connection URI for database access.
      value: <- connection-target("mongodb") entity-state get-member("connection/uri")
    redis-uri:
      type: string
      env: REDIS_URI
      description: Redis connection URI for job queue and caching.
      value: <- connection-target("redis") entity-state get-member("connection/uri")
    minio-endpoint:
      type: string
      env: MINIO_ENDPOINT
      description: MinIO server endpoint for object storage.
      value: <- connection-hostname("minio") ":" connection-port("minio") concat-all
    minio-access-key:
      type: string
      env: MINIO_ACCESS_KEY
      description: Access key for MinIO object storage.
      value: <- $global-minio-access-key default("minioadmin")
    minio-secret-key:
      type: string
      env: MINIO_SECRET_KEY
      description: Secret key for MinIO object storage.
      value: <- $global-minio-secret-key default("minioadmin")
    minio-use-ssl:
      type: bool
      env: MINIO_USE_SSL
      description: Whether to use SSL for MinIO connection.
      value: <- $global-minio-use-ssl default("false")
    frontend-url:
      type: string
      env: FRONTEND_URL
      description: URL of the frontend application for CORS and redirects.
      value: <- "https://" domain-name "," connection-target("frontend") entity-state get-member("url") concat-all
      # value: "*"
    jwt-secret:
      type: string
      env: JWT_SECRET
      description: Secret key for signing JWT tokens.
      value: your_jwt_secret_key_here
    cors-origins:
      type: string
      env: CORS_ORIGINS
      description: Allowed origins for CORS.
      value: <- "https://" domain-name concat-all
    log-level:
      type: string
      env: LOG_LEVEL
      description: Logging level for the backend application.
      value: info
    node-env:
      type: string
      env: NODE_ENV
      description: "Node environment (for compatibility, not used by Go)."
      value: development
    go-env:
      type: string
      env: GO_ENV
      description: Go environment (development/production).
      value: development
    auth0-domain:
      type: string
      env: AUTH0_DOMAIN
      description: Auth0 domain for authentication.
      value: <- secret("default-auth0-management-api-url")
    auth0-audience:
      type: string
      env: AUTH0_AUDIENCE
      description: Auth0 audience for authentication.
      value: <- $global-auth0-audience

worker:
  defines: runnable
  metadata:
    name: worker
    description: "Go-based video processing worker. Consumes jobs from Redis, processes videos using FFmpeg, stores results in MinIO, and updates MongoDB. Multiple instances can be run for scalability."
  permitted-secrets:
    default-redis-cloud-db-password: true
    mongodb-password: true
  containers:
    main:
      image: "worker"
      image-tag: "latest"
  services: {}
  connections:
    mongodb:
      target: video-hosting-example/mongodb-database
      service: data
    redis:
      target: video-hosting-example/redis
      service: redis-svc
    minio:
      target: video-hosting-example/minio
      service: api
  depends:
    wait-for:
      runnables:
        - video-hosting-example/mongodb-database
        - video-hosting-example/redis
        - video-hosting-example/minio
      timeout: 300
  variables:
    worker-id:
      type: string
      env: WORKER_ID
      description: Unique identifier for the worker instance.
      value: worker1
    mongodb-password:
      env: MONGODB_PASSWORD
      value: <- secret("mongodb-password")
      type: string
    mongodb-connection-string:
      env: MONGODB_CONNECTION_STRING
      value: <- connection-target("mongodb") entity-state get-member("connection/uri")
      type: string
    mongodb-uri:
      type: string
      env: MONGODB_URI
      description: MongoDB connection URI for database access.
      value: <- connection-target("mongodb") entity-state get-member("connection/uri")
    redis-uri:
      type: string
      env: REDIS_URI
      description: Redis connection URI for job queue and caching.
      value: <- connection-target("redis") entity-state get-member("connection/uri")
    minio-endpoint:
      type: string
      env: MINIO_ENDPOINT
      description: MinIO server endpoint for object storage.
      value: <- connection-hostname("minio") ":" connection-port("minio") concat-all
    minio-access-key:
      type: string
      env: MINIO_ACCESS_KEY
      description: Access key for MinIO object storage.
      value: <- $global-minio-access-key default("minioadmin")
    minio-secret-key:
      type: string
      env: MINIO_SECRET_KEY
      description: Secret key for MinIO object storage.
      value: <- $global-minio-secret-key default("minioadmin")
    minio-use-ssl:
      type: bool
      env: MINIO_USE_SSL
      description: Whether to use SSL for MinIO connection.
      value: <- $global-minio-use-ssl default("false")
    minio-bucket-name:
      type: string
      env: MINIO_BUCKET_NAME
      description: Bucket name in MinIO for storing videos.
      value: videos
    worker-count:
      type: int
      env: WORKER_COUNT
      description: Number of worker instances to run.
      value: 2
    worker-concurrency:
      type: int
      env: WORKER_CONCURRENCY
      description: Number of concurrent jobs a worker can process.
      value: 2
    max-file-size:
      type: string
      env: MAX_FILE_SIZE
      description: Maximum allowed file size for uploads.
      value: 1GB
    supported-formats:
      type: string
      env: SUPPORTED_FORMATS
      description: Comma-separated list of supported video formats.
      value: "mp4,avi,mov,wmv,flv,webm"
    output-formats:
      type: string
      env: OUTPUT_FORMATS
      description: Comma-separated list of output video resolutions.
      value: "480p,720p,1080p"
    log-level:
      type: string
      env: LOG_LEVEL
      description: Logging level for the worker application.
      value: info
    node-env:
      type: string
      env: NODE_ENV
      description: "Node environment (for compatibility, not used by Go)."
      value: development
    go-env:
      type: string
      env: GO_ENV
      description: Go environment (development/production).
      value: development

minio:
  defines: runnable
  inherits: minio/minio-server
  variables:
    admin-password:
      type: string
      env: MINIO_ROOT_PASSWORD
      description: The root password for the MinIO admin user.
      value: <- $global-minio-secret-key default("minioadmin")
    api-port:
      type: int
      env: api-port
      description: Port for the MinIO S3-compatible API service.
      value: 9000
    admin-username:
      type: string
      env: MINIO_ROOT_USER
      description: The root username for the MinIO admin user.
      value: <- $global-minio-access-key default("minioadmin")
    console-port:
      type: int
      env: MINIO_CONSOLE_PORT
      description: Port for the MinIO web console.
      value: 9001
  services:
    api:
      publish: true

proxy:
  defines: runnable
  inherits: nginx/node-proxy
  connections:
    backend:
      target: video-hosting-example/backend
      service: http
  depends:
    wait-for:
      runnables:
        - video-hosting-example/backend
      timeout: 300

frontend:
  defines: runnable
  inherits: netlify/deploy
  containers:
    deploy:
      paths:
        - "blobs://frontend:/home/node/app"
  variables:
    deploy-dir: build
    site-id: <- connection-target("site") entity-state get-member("id")
    pre-deploy: |
      npm install
      npm run build
      echo '/* /index.html 200' >> build/_redirects

    react-app-api-url:
      type: string
      env: REACT_APP_API_URL
      description: URL of the backend API for the frontend to communicate with.
      value: <- "https://" connection-domain-name("backend-api") concat-all
    react-app-minio-url:
      type: string
      env: REACT_APP_MINIO_URL
      description: URL of the MinIO server for accessing video assets.
      value: <- "http://" connection-domain-name("minio-api") ":9000" concat-all
    node-env:
      type: string
      env: NODE_ENV
      description: Node environment for the frontend build.
      value: development
    auth0-domain:
      type: string
      env: REACT_APP_AUTH0_DOMAIN
      description: Auth0 domain for authentication.
      value: <- secret("default-auth0-management-api-url")
    auth0-audience:
      type: string
      env: REACT_APP_AUTH0_AUDIENCE
      description: Auth0 audience for authentication.
      value: <- $global-auth0-audience
    auth0-client-id:
      type: string
      env: REACT_APP_AUTH0_CLIENT_ID
      description: Auth0 client ID for authentication.
      value: <- connection-target("auth0") entity-state get-member("client-id")
  connections:
    site:
      target: video-hosting-example/frontend-site
      service: data
    backend-api:
      target: video-hosting-example/proxy
      service: nginx
    minio-api:
      target: video-hosting-example/minio
      service: api
    auth0:
      target: video-hosting-example/auth0
      service: data
  depends:
    wait-for:
      runnables:
        - video-hosting-example/frontend-site
        - video-hosting-example/proxy
        - video-hosting-example/minio
        - video-hosting-example/auth0
      timeout: 60
  permitted-secrets:
    default-auth0-management-api-url: true

stack:
  defines: group
  variables:
    global-minio-access-key:
      type: string
      description: Access key for MinIO object storage.
      value: minioadmin
    global-minio-secret-key:
      type: string
      description: Secret key for MinIO object storage.
      value: minioadmin
    global-minio-use-ssl:
      type: bool
      description: Whether to use SSL for MinIO connection.
      value: false
    global-auth0-audience:
      type: string
      description: Auth0 audience for authentication.
      value: https://videotube
  members:
    - video-hosting-example/backend
    - video-hosting-example/worker
    - video-hosting-example/mongodb-database
    - video-hosting-example/spaces-keys
    - video-hosting-example/spaces
    - video-hosting-example/minio
    - video-hosting-example/proxy
    - video-hosting-example/frontend-site
    - video-hosting-example/frontend
    - video-hosting-example/redis
    - video-hosting-example/auth0
