namespace: video-hosting-example

video-hosting-moderation-agent-v3:
  defines: digitalocean-agent/agent
  name: <- $environment "-comment-moderation-agent-v3" concat-all
  instruction: |
    You moderate comments for a video hosting platform.
    Review the submitted comment and determine whether it is acceptable.
    Return strict JSON only, with exactly these fields:
    {
      "ok": boolean,
      "category": string,
      "reason": string,
      "confidence": number
    }
    Rules:
    - ok must be true only when the comment is safe to publish.
    - category must be one of: approved, spam, harassment, hate, sexual, violence, self-harm, illegal, other.
    - reason must be a short plain-language explanation.
    - confidence must be a number between 0 and 1.
    - Do not include markdown, code fences, extra keys, or any text outside the JSON object.
  model_id: OpenAI GPT-oss-20b
  project_id: ""
  tags:
    - video-hosting-example
    - environment:production
    - credential-rotation:endpoint-api-key-v3
  region: tor1
  publish: true
  checks:
    readiness:
      period: 15
      attempts: 10
      initialDelay: 5
  services:
    data:
      protocol: custom
  variables:
    environment:
      type: string
      value: production

spaces-keys:
  defines: digitalocean-spaces/spaces-keys
  name: video-hosting-example-spaces-keys
  permitted-secrets:
    do-spaces-access-key: true
    do-spaces-secret-key: true
  services:
    data:
      protocol: custom

spaces:
  defines: digitalocean-spaces/spaces-bucket
  bucket_name: vhx-videos-bucket-production
  region: nyc3
  access_key_secret_ref: do-spaces-access-key
  secret_key_secret_ref: do-spaces-secret-key
  versioning: false
  public_read_access: true
  public_write_access: false
  services:
    bucket:
      protocol: custom
  connections:
    spaces-keys:
      target: video-hosting-example/spaces-keys
      service: data
  depends:
    wait-for:
      runnables:
        - video-hosting-example/spaces-keys
      timeout: 300
  permitted-secrets:
    do-spaces-access-key: true
    do-spaces-secret-key: true

mongodb:
  defines: digitalocean-database/database
  name: vhe-mongo-prod
  engine: mongodb
  version: "7.0"
  num_nodes: 1
  region: nyc3
  size: db-s-1vcpu-1gb
  tags:
    - environment:production
    - application:video-hosting-example
    - service:mongodb
  services:
    data:
      protocol: custom
  checks:
    readiness:
      period: 30
      initialDelay: 5
      attempts: 40

valkey:
  defines: digitalocean-database/database
  name: vhe-valkey-prod
  engine: valkey
  num_nodes: 1
  region: nyc3
  size: db-s-1vcpu-1gb
  tags:
    - environment:production
    - application:video-hosting-example
    - service:valkey
  services:
    data:
      protocol: custom
  checks:
    readiness:
      period: 30
      initialDelay: 5
      attempts: 40

frontend:
  defines: runnable
  affinity:
    node: video-hosting-prod-2
  containers:
    main:
      image: frontend:latest
  services:
    http:
      description: Primary user-facing React frontend served by nginx.
      container: main
      port: 3000
      protocol: tcp
      ingress-routes:
        app:
          path-prefix: /
  connections:
    backend-api:
      target: video-hosting-example/backend
      service: http
    auth0-app:
      target: video-hosting-example/auth0-app
      service: data
    auth0-api:
      target: video-hosting-example/auth0-api
      service: data
    spaces:
      target: video-hosting-example/spaces
      service: bucket
  depends:
    wait-for:
      runnables:
        - video-hosting-example/backend
        - video-hosting-example/spaces
      timeout: 900
  checks:
    readiness:
      code: http-get-service("video-hosting-example/frontend", "http", "/") get-member("status") 200 eq?
      period: 15
      initialDelay: 10
    liveness:
      code: tcp-check-service("video-hosting-example/frontend", "http")
      period: 30
      initialDelay: 15
  variables:
    react-app-api-url:
      type: string
      env: REACT_APP_API_URL
      description: Public backend API URL exposed via Monk ingress.
      value: <- "https://" connection-domain-name("backend-api") "/api" concat-all
    react-app-minio-url:
      type: string
      env: REACT_APP_MINIO_URL
      description: Public base URL for thumbnails and processed assets in DigitalOcean Spaces.
      value: <- "https://" connection-target("spaces") entity-state get-member("bucket_name") "." connection-target("spaces") entity-state get-member("endpoint") replace("https://", "") replace("http://", "") concat-all
    react-app-auth0-domain:
      type: string
      env: REACT_APP_AUTH0_DOMAIN
      description: Auth0 issuer domain for SPA login.
      value: <- connection-target("auth0-app") entity-state get-member("issuer")
    react-app-auth0-audience:
      type: string
      env: REACT_APP_AUTH0_AUDIENCE
      description: Auth0 API audience for SPA access tokens.
      value: <- connection-target("auth0-api") entity-state get-member("audience")
    react-app-auth0-client-id:
      type: string
      env: REACT_APP_AUTH0_CLIENT_ID
      description: Auth0 SPA client id.
      value: <- connection-target("auth0-app") entity-state get-member("client-id")

auth0-app:
  defines: auth0/application
  domain: <- secret("default-auth0-management-api-url")
  app-name: Video Hosting Example Frontend
  app_type: spa
  callback-url: <- "https://" connection-domain-name("frontend") concat-all
  allowed-logout-urls:
    - <- "https://" connection-domain-name("frontend") concat-all
  web-origins:
    - <- "https://" connection-domain-name("frontend") concat-all
  allowed-origins:
    - <- "https://" connection-domain-name("frontend") concat-all
  token-endpoint-auth-method: none
  management-client-id-secret: default-auth0-management-client-id
  management-client-token-secret: default-auth0-management-client-secret
  management-api: <- "https://" secret("default-auth0-management-api-url") concat-all
  services:
    data:
      protocol: custom
  connections:
    frontend:
      target: video-hosting-example/frontend
      service: http
  depends:
    wait-for:
      runnables:
        - video-hosting-example/frontend
      timeout: 600
  permitted-secrets:
    default-auth0-management-client-id: true
    default-auth0-management-client-secret: true
    default-auth0-management-api-url: true

auth0-api:
  defines: auth0/resource-server
  domain: <- secret("default-auth0-management-api-url")
  name: Video Hosting Example API
  audience: <- "https://" connection-domain-name("backend-api") "/api" concat-all
  client-id: <- connection-target("auth0-client") entity-state get-member("client-id")
  management-client-id-secret: default-auth0-management-client-id
  management-client-token-secret: default-auth0-management-client-secret
  management-api: <- "https://" secret("default-auth0-management-api-url") concat-all
  services:
    data:
      protocol: custom
  connections:
    auth0-client:
      target: video-hosting-example/auth0-app
      service: data
    backend-api:
      target: video-hosting-example/backend
      service: http
  depends:
    wait-for:
      runnables:
        - video-hosting-example/auth0-app
      timeout: 600
  permitted-secrets:
    default-auth0-management-client-id: true
    default-auth0-management-client-secret: true
    default-auth0-management-api-url: true

backend:
  defines: runnable
  affinity:
    node: video-hosting-prod-2
  containers:
    main:
      image: backend:latest
  services:
    http:
      description: Public HTTP API for uploads, metadata, streaming, and comments.
      container: main
      port: 8080
      protocol: tcp
      ingress-routes:
        api:
          path-prefix: /api/
          path-rewrite:
            regex: "^/api/(.*)"
            to: "/$1"
  connections:
    mongodb:
      target: video-hosting-example/mongodb
      service: data
    valkey:
      target: video-hosting-example/valkey
      service: data
    spaces:
      target: video-hosting-example/spaces
      service: bucket
    spaces-keys:
      target: video-hosting-example/spaces-keys
      service: data
    frontend:
      target: video-hosting-example/frontend
      service: http
    auth0-app:
      target: video-hosting-example/auth0-app
      service: data
    auth0-api:
      target: video-hosting-example/auth0-api
      service: data
    llm-agent:
      target: video-hosting-example/video-hosting-moderation-agent-v3
      service: data
  depends:
    wait-for:
      runnables:
        - video-hosting-example/mongodb
        - video-hosting-example/valkey
        - video-hosting-example/spaces-keys
        - video-hosting-example/spaces
        - video-hosting-example/video-hosting-moderation-agent-v3
      timeout: 900
  checks:
    readiness:
      code: http-get-service("video-hosting-example/backend", "http", "/health") get-member("status") 200 eq?
      period: 15
      initialDelay: 15
    liveness:
      code: tcp-check-service("video-hosting-example/backend", "http")
      period: 30
      initialDelay: 20
  permitted-secrets:
    do-spaces-access-key: true
    do-spaces-secret-key: true
    default-auth0-management-api-url: true
  variables:
    port:
      type: int
      env: PORT
      description: Backend HTTP listen port.
      value: 8080
    go-env:
      type: string
      env: GO_ENV
      description: Go runtime environment.
      value: production
    mongodb-uri:
      type: string
      env: MONGODB_URI
      description: Managed MongoDB connection URI.
      value: <- connection-target("mongodb") entity-state get-member("connection_uri")
    redis-uri:
      type: string
      env: REDIS_URI
      description: Managed Valkey connection URI.
      value: <- connection-target("valkey") entity-state get-member("connection_uri")
    minio-endpoint:
      type: string
      env: MINIO_ENDPOINT
      description: S3-compatible endpoint host for DigitalOcean Spaces.
      value: <- connection-target("spaces") entity-state get-member("endpoint") replace("https://", "") replace("http://", "")
    minio-access-key:
      type: string
      env: MINIO_ACCESS_KEY
      description: Access key for Spaces object storage.
      value: <- connection-target("spaces-keys") entity-state get-member("access_key")
    spaces-secret-key-ref:
      type: string
      description: Secret reference provided by the connected Spaces integration.
      value: <- connection-target("spaces") entity get-member("secret_key_secret_ref")
    minio-secret-key:
      type: string
      env: MINIO_SECRET_KEY
      description: Secret key for Spaces object storage.
      value: <- secret($spaces-secret-key-ref)
    minio-use-ssl:
      type: bool
      env: MINIO_USE_SSL
      description: Whether to use SSL for the DigitalOcean Spaces connection.
      value: true
    minio-bucket-name:
      type: string
      env: MINIO_BUCKET_NAME
      description: Spaces bucket used for videos and thumbnails.
      value: <- connection-target("spaces") entity-state get-member("bucket_name")
    frontend-url:
      type: string
      env: FRONTEND_URL
      description: Public frontend URL used for CORS and redirects.
      value: <- "https://" connection-domain-name("frontend") concat-all
    auth0-domain:
      type: string
      env: AUTH0_DOMAIN
      description: Auth0 issuer domain.
      value: <- connection-target("auth0-app") entity-state get-member("issuer")
    auth0-audience:
      type: string
      env: AUTH0_AUDIENCE
      description: Auth0 resource server audience.
      value: <- connection-target("auth0-api") entity-state get-member("audience")
    llm-enabled:
      type: bool
      env: LLM_ENABLED
      description: Enable LLM-powered comment moderation.
      value: true
    llm-api-url:
      type: string
      env: LLM_API_URL
      description: DigitalOcean agent endpoint for comment moderation requests.
      value: <- connection-target("llm-agent") entity-state get-member("endpoint")
    llm-api-token:
      type: string
      env: LLM_API_TOKEN
      description: API token for the DigitalOcean moderation agent endpoint.
      value: <- connection-target("llm-agent") entity-state get-member("endpoint_api_key")
    llm-model:
      type: string
      env: LLM_MODEL
      description: Inference model used for comment moderation.
      value: OpenAI GPT-oss-20b

worker:
  defines: runnable
  containers:
    main:
      image: worker:latest
  services: {}
  scale:
    value: 2
  connections:
    mongodb:
      target: video-hosting-example/mongodb
      service: data
    valkey:
      target: video-hosting-example/valkey
      service: data
    spaces:
      target: video-hosting-example/spaces
      service: bucket
    spaces-keys:
      target: video-hosting-example/spaces-keys
      service: data
    llm-agent:
      target: video-hosting-example/video-hosting-moderation-agent-v3
      service: data
  depends:
    wait-for:
      runnables:
        - video-hosting-example/mongodb
        - video-hosting-example/valkey
        - video-hosting-example/spaces-keys
        - video-hosting-example/spaces
        - video-hosting-example/video-hosting-moderation-agent-v3
      timeout: 900
  permitted-secrets:
    do-spaces-access-key: true
    do-spaces-secret-key: true
  variables:
    mongodb-uri:
      type: string
      env: MONGODB_URI
      description: Managed MongoDB connection URI.
      value: <- connection-target("mongodb") entity-state get-member("connection_uri")
    redis-uri:
      type: string
      env: REDIS_URI
      description: Managed Valkey connection URI.
      value: <- connection-target("valkey") entity-state get-member("connection_uri")
    minio-endpoint:
      type: string
      env: MINIO_ENDPOINT
      description: S3-compatible endpoint host for DigitalOcean Spaces.
      value: <- connection-target("spaces") entity-state get-member("endpoint") replace("https://", "") replace("http://", "")
    minio-access-key:
      type: string
      env: MINIO_ACCESS_KEY
      description: Access key for Spaces object storage.
      value: <- connection-target("spaces-keys") entity-state get-member("access_key")
    spaces-secret-key-ref:
      type: string
      description: Secret reference provided by the connected Spaces integration.
      value: <- connection-target("spaces") entity get-member("secret_key_secret_ref")
    minio-secret-key:
      type: string
      env: MINIO_SECRET_KEY
      description: Secret key for Spaces object storage.
      value: <- secret($spaces-secret-key-ref)
    minio-use-ssl:
      type: bool
      env: MINIO_USE_SSL
      description: Whether to use SSL for the DigitalOcean Spaces connection.
      value: true
    minio-bucket-name:
      type: string
      env: MINIO_BUCKET_NAME
      description: Spaces bucket used for videos and thumbnails.
      value: <- connection-target("spaces") entity-state get-member("bucket_name")
    worker-id:
      type: string
      env: WORKER_ID
      description: Stable worker identifier prefix used by all replicas.
      value: video-worker
    worker-count:
      type: int
      env: WORKER_COUNT
      description: Total worker replicas expected by the app.
      value: 2
    worker-concurrency:
      type: int
      env: WORKER_CONCURRENCY
      description: Per-worker concurrency for low-traffic demo scale.
      value: 2
    go-env:
      type: string
      env: GO_ENV
      description: Go runtime environment.
      value: production
    llm-enabled:
      type: bool
      env: LLM_ENABLED
      description: Enable LLM-powered comment moderation.
      value: true
    llm-api-url:
      type: string
      env: LLM_API_URL
      description: DigitalOcean agent endpoint for comment moderation requests.
      value: <- connection-target("llm-agent") entity-state get-member("endpoint")
    llm-api-token:
      type: string
      env: LLM_API_TOKEN
      description: API token for the DigitalOcean moderation agent endpoint.
      value: <- connection-target("llm-agent") entity-state get-member("endpoint_api_key")
    llm-model:
      type: string
      env: LLM_MODEL
      description: Inference model used for comment moderation.
      value: OpenAI GPT-oss-20b

endpoints:
  defines: monkec/endpoints
  entrypoint: frontend
  endpoints:
    frontend:
      url: <- "https://" connection-domain-name("frontend") concat-all
      description: Primary public URL for the React frontend.
    backend-api:
      url: <- "https://" connection-domain-name("backend") "/api" concat-all
      description: Public base URL for the backend API ingress route.
    spaces-bucket:
      url: <- "https://" connection-target("spaces") entity-state get-member("bucket_name") "." connection-target("spaces") entity-state get-member("endpoint") replace("https://", "") replace("http://", "") concat-all
      description: Public DigitalOcean Spaces bucket URL for directly accessible assets.
  connections:
    frontend:
      target: video-hosting-example/frontend
      service: http
    backend:
      target: video-hosting-example/backend
      service: http
    spaces:
      target: video-hosting-example/spaces
      service: bucket
  depends:
    wait-for:
      runnables:
        - video-hosting-example/frontend
        - video-hosting-example/backend
        - video-hosting-example/spaces
      timeout: 600

prod:
  defines: group
  members:
    - video-hosting-example/video-hosting-moderation-agent-v3
    - video-hosting-example/spaces-keys
    - video-hosting-example/spaces
    - video-hosting-example/mongodb
    - video-hosting-example/valkey
    - video-hosting-example/frontend
    - video-hosting-example/auth0-app
    - video-hosting-example/backend
    - video-hosting-example/auth0-api
    - video-hosting-example/worker
    - video-hosting-example/endpoints
  variables:
    environment:
      type: string
      value: production
      env: ENVIRONMENT
